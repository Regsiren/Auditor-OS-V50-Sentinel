[project]
name = "sentinel-core"
version = "1.1.1"
description = "RFC-001 Kinematic AI Gatekeeper Standard"
dependencies = [
    "pydantic>=2.0.0",
    "pynacl>=1.5.0"
]

[tool.setuptools.packages.find]
where = ["src"]
